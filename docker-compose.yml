name: shoppilot

services:
  db:
    image: pgvector/pgvector:0.8.7-pg16
    environment:
      POSTGRES_USER: shoppilot
      POSTGRES_PASSWORD: shoppilot
      POSTGRES_DB: shoppilot
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shoppilot -d shoppilot"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
