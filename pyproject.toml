[project]
name = "shoppilot"
version = "0.1.0"
description = "Agentic shopping assistant: hybrid retrieval, learning-to-rank and a tool-using LLM agent, evaluated on Amazon ESCI"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Anatoli Perederii" }]
dependencies = [
    "alembic>=1.20.1",
    "bm25s>=0.3.16",
    "fastapi>=0.162.5",
    "httpx>=0.28.1",
    "lightgbm>=4.7.0",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.8",
    "pyarrow>=26.0.1",
    "pydantic-settings>=2.16.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "sentence-transformers>=6.2.0",
    "sqlalchemy>=2.1.8",
    "tqdm>=4.70.1",
    "uvicorn>=0.54.0",
    "zstandard>=0.25.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
notebooks = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "seaborn>=0.13.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
default-groups = ["dev", "notebooks"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
